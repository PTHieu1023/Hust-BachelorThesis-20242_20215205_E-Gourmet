<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #messages {
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        #connection-status {
            margin-bottom: 10px;
        }
        .message {
            margin: 5px 0;
        }
        .sent {
            color: blue;
        }
        .received {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div id="connection-status">Status: Disconnected</div>
    
    <div>
        <input type="text" id="userId" placeholder="Your User ID" value="user1">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()" disabled>Disconnect</button>
    </div>

    <div id="messages"></div>

    <div>
        <input type="text" id="toUser" placeholder="To User ID" value="user2">
        <input type="text" id="message" placeholder="Type your message">
        <button onclick="sendMessage()" disabled>Send</button>
    </div>

    <script>
        let ws;
        const token = "eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICI2ei1VNFlGbFZZVE4tQ2M2QU5NNW9YejZtTU9HVDctcklHZ3dTMnZXZkdjIn0.eyJleHAiOjE3NDI4MDI5MjgsImlhdCI6MTc0MjgwMjYyOCwianRpIjoiZjhlZmNlN2YtZGZhNS00YzAxLWFlMmMtMWE2YjYxOWRjODhjIiwiaXNzIjoiaHR0cDovL2xvY2FsaG9zdDo5MDgwL3JlYWxtcy9lLWdvdXJtZXQiLCJhdWQiOiJhY2NvdW50Iiwic3ViIjoiNWMyMGExM2MtYzJjZS00YjMxLTk3ODgtYjgyM2E3ODI2OTQ3IiwidHlwIjoiQmVhcmVyIiwiYXpwIjoiZS1nb3VybWV0Iiwic2lkIjoiZmE0YzIyYmUtOThiNS00YzAyLThhMmMtYjcxMTFkNDMzMWU0IiwiYWNyIjoiMSIsImFsbG93ZWQtb3JpZ2lucyI6WyIqIl0sInJlYWxtX2FjY2VzcyI6eyJyb2xlcyI6WyJkZWZhdWx0LXJvbGVzLWUtZ291cm1ldCIsIm9mZmxpbmVfYWNjZXNzIiwidW1hX2F1dGhvcml6YXRpb24iXX0sInJlc291cmNlX2FjY2VzcyI6eyJhY2NvdW50Ijp7InJvbGVzIjpbIm1hbmFnZS1hY2NvdW50IiwibWFuYWdlLWFjY291bnQtbGlua3MiLCJ2aWV3LXByb2ZpbGUiXX19LCJzY29wZSI6Im9mZmxpbmVfYWNjZXNzIGVtYWlsIHByb2ZpbGUiLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwibmFtZSI6IlVzZXIgRS1Hb3VybWV0IiwicHJlZmVycmVkX3VzZXJuYW1lIjoidXNlciIsImdpdmVuX25hbWUiOiJVc2VyIiwiZmFtaWx5X25hbWUiOiJFLUdvdXJtZXQiLCJlbWFpbCI6InVzZXJAZWdvdXJtZXQuaXQifQ.gw32vql44KAXKyWNOvy6GJFSQw7xlgVixhnySgwb4CdrpSg7Y68k8vviE2I4skq-3XdSC0vCnMQTRWvInTrXcF6qf9TOb_nJ9IFqmNqoWlKwWHxrqRgOxzEsSJtQwGHtL7d-di295Reun1lJWalaVSMdsvMtB3XmlGgdHT9aR6rA9eUILMzSSGrM6eXOjvXWG4d6Fb_xy54lYgOapa_yMOw68fQ0iDas_KrXggfCUeT0h8n88yYrV1jroKY0LP0rMINfJAW8jKRATMubZ9CDx9FqXyex0wSJ3HKtWdX_WsUWmGk0rgoae6SUpNF6I-apl-lNH5W4JJ1VoEWC5TYHvQ"
        const messagesDiv = document.getElementById('messages');
        const statusDiv = document.getElementById('connection-status');
        const connectBtn = document.querySelector('button:nth-child(2)');
        const disconnectBtn = document.querySelector('button:nth-child(3)');
        const sendBtn = document.querySelector('button:last-child');

        function addMessage(text, type = 'received') {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = `${new Date().toLocaleTimeString()}: ${text}`;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            statusDiv.textContent = `Status: ${connected ? 'Connected' : 'Disconnected'}`;
            connectBtn.disabled = connected;
            disconnectBtn.disabled = !connected;
            sendBtn.disabled = !connected;
        }

        function connect() {
            const userId = document.getElementById('userId').value;
            if (!userId) {
                addMessage('Please enter a User ID', 'error');
                return;
            }

            // Add token as query parameter
            const wsUrl = `ws://localhost:3080/ws?token=${encodeURIComponent(token)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addMessage(`Connected as ${userId}`);
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.from && msg.data) {
                        addMessage(`From ${msg.from}: ${msg.data}`);
                    } else {
                        addMessage(event.data);
                    }
                } catch (e) {
                    addMessage(`Raw message: ${event.data}`);
                }
            };

            ws.onclose = () => {
                addMessage('Disconnected from server');
                updateStatus(false);
                ws = null;
            };

            ws.onerror = (error) => {
                addMessage(`Error: ${error.message || 'WebSocket error'}`, 'error');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('Not connected to server', 'error');
                return;
            }

            const toUser = document.getElementById('toUser').value;
            const message = document.getElementById('message').value;

            if (!toUser || !message) {
                addMessage('Please enter both recipient and message', 'error');
                return;
            }

            const msgObj = {
                data: message,
                from: userId,
                to: toUser,
                topic: "message"
            };

            ws.send(JSON.stringify(msgObj));
            addMessage(`To ${toUser}: ${message}`, 'sent');
            document.getElementById('message').value = '';
        }

        document.getElementById('message').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
